
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrismERP - Business Intelligence Suite</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
        .font-mono-erp {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Initial Loading Animation */
        @keyframes pulse-custom {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.95); }
        }
        .boot-loader {
            animation: pulse-custom 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* ADVANCED PRINT ENGINE v3.0 (PDF Optimized) */
        @media print {
            @page {
                size: A4;
                margin: 12mm;
            }

            html, body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                color: #000 !important;
                font-size: 11pt;
            }

            #root, 
            #root > div, 
            main, 
            .erp-main-content {
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                background: transparent !important;
            }

            aside, 
            header, 
            nav, 
            footer, 
            .no-print, 
            button, 
            .recharts-responsive-container,
            .floating-assistant-trigger {
                display: none !important;
            }

            .print-only {
                display: block !important;
                visibility: visible !important;
                opacity: 1 !important;
                width: 100% !important;
            }

            /* Professional Table Pagination Logic */
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                page-break-inside: auto;
            }
            thead { display: table-header-group !important; }
            tfoot { display: table-footer-group !important; }
            
            tr { page-break-inside: avoid !important; page-break-after: auto !important; }
            
            /* Avoid splitting cards or summary sections */
            .print-card {
                page-break-inside: avoid !important;
                border: 1px solid #e2e8f0 !important;
                margin-bottom: 1rem !important;
            }

            /* Color Adjustments for Ink Economy & Sharpness */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            h1, h2, h3 { color: #000 !important; font-weight: 900 !important; }
            .text-blue-600 { color: #1d4ed8 !important; }
            .bg-slate-50 { background-color: #f9fafb !important; border: 1px solid #f1f5f9 !important; }
            
            /* Hide URL headers/footers browser inserts */
            body { padding-top: 0 !important; }
        }

        .print-only {
            display: none;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "recharts": "https://esm.sh/recharts@2.12.7?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?deps=react@18.3.1",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1?deps=react@18.3.1",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
